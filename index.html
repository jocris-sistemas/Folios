/* ---------- datos ---------- */
/* Pagina una consulta (páginas en paralelo). Con dura=true lanza el error; si no, devuelve null. */
async function pagina(mk, dura, ini) {
  const out = []; let f = 0, n = ini || 1;
  for (;;) {
    const rs = await Promise.all(Array.from({ length: n }, (_, i) => mk().range(f + i * 1000, f + i * 1000 + 999)));
    for (const r of rs) {
      if (r.error) { if (dura) throw r.error; return null; }
      for (let i = 0; i < r.data.length; i++) out.push(r.data[i]);
      if (r.data.length < 1000) return out;
    }
    f += n * 1000; n = 3;
  }
}
async function cargar() {
  const sol = soloFolios();

    sb.from('cargos_unidad').select('cargo_id,unidad').then(r => r, () => ({})),

    sol ? null : pagina(() => sb.from('platon_cruce').select('cargo_id,folio,cheques').not('cheques', 'is', null)),

    cargarExtra()
  ]);
  S.cu = {}; ((cuR && cuR.data) || []).forEach(x => S.cu[x.cargo_id] = x.unidad);
  const cg = cgR.data;
  (cg || []).forEach(c => { if (c.responsable) RESP[c.id] = c.responsable; });
  (cg || []).filter(c => c.activo && (!c.solo_caja || (S.cu || {})[c.id])).forEach(c => { CARGOS[c.id] = limpia(c.nombre); CARGO_ID[limpia(c.nombre)] = c.id; });
  S.chq = (chR && chR.data) || [];
  S.rows = rows;
  const hay = new Set(rows.map(r => r.cargo_id));
  (cg || []).forEach(c => { if (!CARGOS[c.id] && hay.has(c.id)) CARGOS[c.id] = limpia(c.nombre); });
  if (sol) { S.cruce = {}; S.medio = {}; S.unidad = 'PLATON'; return; }
  if (cruce) { const cr = {}; cruce.forEach(r => cr[r.cargo_id + '-' + r.folio] = r.cheques); S.cruce = cr; }
  if (medio) { const md = {}; medio.forEach(r => md[r.mov_id] = r); S.medio = md; }
  S.fp = {}; S.fpc = {}; S.sug = {};
  (fpR || []).forEach(r => { if (r.origen_app === 'CANCUN') S.fpc[r.clave] = r; else S.fp[r.clave] = r; });
  ((sgR && sgR.data) || []).forEach(x => (S.sug[x.mov_id] = S.sug[x.mov_id] || []).push(x));
}
async function cargarExtra() {
  const sol = soloFolios();
  const tArch = pagina(() => sb.from('platon_archivos').select('id,mov_id,tipo,path,nombre,subido_en').eq('activo', true));
  const tAc = sol ? null : pagina(() => sb.from('platon_acumulado').select('id,semana,mov_id,monto,nota,creado_en').eq('activo', true));

    const ac = await tAc; if (ac) S.acum = ac;
    S.hoja = {}; const h = await tHoja; ((h && h.data) || []).forEach(x => { S.hoja[x.semana] = x; });
  }
  if (tCn) await tCn;
}
async function cargaCancun() {
  try {
    const [cn, a, b, cu, gc, rp] = await Promise.all([
      pagina(() => sb.from('cancun_movimientos').select('id,fecha,cargo,folio,concepto,monto,pago,tipo,categoria,villa,comentarios,depto,pagado,pagado_nota,cuenta_id').order('fecha', { ascending: false })),

}
async function boot() {

const pendRev = () => soloFolios() ? [] : S.rows.filter(r => r.tipo === 'EGRESO' && r.unidad === 'PLATON' && !r.revisado_en && !esPasado(r));

/* ---------- Acumulado semanal ---------- */
const viernesDe = iso => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + ((5 - d.getUTCDay() + 7) % 7)); return d.toISOString().slice(0, 10); };
const sumaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

const FOLIO_TXT = f => /^\d+$/.test(String(f)) ? String(f).padStart(3, '0') : String(f == null ? '' : f);
const semanaTxt = v => { const a = sumaDias(v, -4).split('-'), b = sumaDias(v, 2).split('-'), M = MESES_L; return a[1] === b[1] ? `SEMANA DEL ${+a[2]} AL ${+b[2]} DE ${M[+b[1] - 1]} ${b[0]}` : `SEMANA DEL ${+a[2]} DE ${M[+a[1] - 1]}${a[0] !== b[0] ? ' ' + a[0] : ''} AL ${+b[2]} DE ${M[+b[1] - 1]} ${b[0]}`; };
function hojaLineas(sem) {
  const byId = new Map(S.rows.map(r => [r.id, r])), act = S.acum.filter(a => a.semana === sem && byId.has(a.mov_id)), am = new Set(act.map(a => a.mov_id)), g = (S.hoja || {})[sem], out = [], usados = new Set();

  const total = datos.reduce((t, x) => t + (x.b ? 0 : x.m), 0), pags = Math.max(1, Math.ceil((datos.length + 1) / N));

/* ---------- Importar Excel ---------- */
/* Lee dos formatos:
   1) Formato de la oficina (FOLIOS_2026.xls): una hoja por mes y, dentro, un bloque por cargo
      ("ING. EGBERT SIERCKE", "ING. RENE", "ING. OMAR ELIZONDO") con FECHA | N° FOLIO | CONCEPTO | IMPORTE y su fila TOTAL.
   2) Formato de tabla: encabezados FECHA, CARGO, CONCEPTO (o CLIENTE), MONTO y opcionales FOLIO, TIPO, CATEGORIA, UNIDAD.
   Nunca borra ni renumera: los folios nuevos se agregan con su número, los que ya existen se comparan y
   las diferencias solo se aplican si la persona las marca (queda bitácora con el valor anterior). */
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();

  if (v instanceof Date) return isNaN(v) ? null : `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}`;
  const s = String(v).trim(); let m, y, mo, d;

  else if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))) [y, mo, d] = [m[3].length === 2 ? '20' + m[3] : m[3], m[2], m[1]];
  else if ((m = norm(s).match(/^(\d{1,2})[-\/ ]+(?:DE )?([A-Z]{3})[A-Z]*[-\/ ]+(?:DE )?(\d{2,4})$/))) { const i = MESES.indexOf(m[2].toLowerCase()); if (i < 0) return null; [y, mo, d] = [m[3].length === 2 ? '20' + m[3] : m[3], String(i + 1), m[1]]; }
  else return null;
  const f = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`, t = new Date(f + 'T12:00:00Z');
  return isNaN(t) || t.toISOString().slice(0, 10) !== f ? null : f;
}

/* Categoría sugerida para folios nuevos: la última que se usó con el mismo concepto en ese cargo, luego en cualquier cargo, luego por palabra clave */
const CAT_REGLAS = [[/HORAS EXTRA|RAYA|PRESTAMO|VACACION|FINIQUITO|AGUINALDO/, 'RAYAS'], [/IMSS|INFONAVIT|SEGURO SOCIAL/, 'IMSS'], [/TELMEX|TELCEL|INTERNET|TELEFON|IZZI|DIPSA/, 'TELEFONIA - INTERNET'],
  [/GASOLIN|VALES/, 'GASOLINA'], [/RENTA/, 'RENTA OFICINA'], [/AGUA/, 'AGUA'], [/CFE|LUZ/, 'LUZ'], [/PAPELERIA|TONER/, 'PAPELERIA'], [/MEDIC|MAFRE|MAPFRE/, 'GASTOS MEDICOS'],
  [/VIATICO/, 'VIATICOS'], [/REPARACION|MECANIC|AFINACION|REFRENDO|PLACAS|SEGURO.*AUTO|LLANTA|BALATA|MERIVA|POINTER|OPTIMA|KIA|LUV|CORRALON|CAMIONETA/, 'MTTO AUTOS']];

    const usada = S.rows.find(r => r.cargo_id === cargoId && r.categoria && (norm(r.categoria) === cat || (cat === 'MTTO AUTOS' && norm(r.categoria) === 'MTTO AUTO') || (cat === 'LUZ' && norm(r.categoria) === 'CFE')));

function cargoEnTexto(t) {   // "ING. EGBERT SIERCKE" -> id de EGBERT

/* ---------- Conciliación de ingresos: banco (CSV) y archivo PAGOS de la oficina ---------- */
const P = { pagos: [], dep: null, imp: null, vista: 'resumen', cargo: 0, mes: '', est: '', q: '', sel: null, prop: null, cargado: false, ok: '' };
const ING_N = ['EGBERT', 'OMAR', 'RENE'];

const dias = (a, b) => Math.abs((new Date(a + 'T12:00:00Z') - new Date(b + 'T12:00:00Z')) / 864e5);
async function cargarPagos() {

const ligadoPor = () => { const m = {}; P.pagos.forEach(p => { if (p.deposito_id) m[p.deposito_id] = (m[p.deposito_id] || 0) + c100(p.total); }); return m; };

/* Lectura del archivo PAGOS: una hoja por mes y un bloque por ingeniero (FECHA, FAC., CLIENTE, IMPORTE, I.V.A, TOTAL) */
function leerPagos(wb) {
  const res = { filas: [], errores: [], avisos: [], ignorados: [] };
  wb.SheetNames.forEach(hoja => {
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[hoja], { header: 1, raw: true, defval: null, blankrows: true });
    const mesHoja = MESES_L.findIndex(m => norm(hoja).includes(m));
    let cargo = 0, nombre = '', c = null, suma = 0, n = 0, total = null;
    const cierra = () => { if (c && n && total != null && Math.abs(r2(suma) - r2(total)) > 0.02) res.avisos.push(`Hoja ${hoja}: la suma de las facturas de ${nombre} (${money(suma)}) no coincide con el TOTAL del Excel (${money(total)}).`); c = null; suma = 0; n = 0; total = null; };
    filas.forEach((r, i) => {
      if (!r) return; const fila = i + 1, textos = r.map(x => typeof x === 'string' ? norm(x) : '');
      if (textos.includes('FECHA') && textos.includes('TOTAL')) {
        cierra();
        const col = (...ns) => textos.findIndex(t => ns.includes(t.replace(/[. ]/g, '')));
        c = { f: textos.indexOf('FECHA'), fa: textos.findIndex(t => t.startsWith('FAC')), cl: textos.indexOf('CLIENTE'), im: col('IMPORTE'), iv: col('IVA'), t: textos.indexOf('TOTAL') };
        if (!cargo || c.fa < 0 || c.cl < 0) { res.ignorados.push(`Hoja ${hoja}, fila ${fila}: tabla sin ingeniero reconocido o sin columnas FAC. y CLIENTE; no se importa.`); c = null; }
        return;
      }
      if (r.every(vacio)) return;
      const tt = textos.findIndex(t => t.startsWith('TOTAL'));
      if (tt >= 0) { if (c) { const v = aNum(r[c.t]); if (v != null) total = v; } cierra(); return; }
      if (!c) {
        const t0 = textos.slice(0, 3).findIndex(t => t && cargoEnTexto(t));
        if (t0 >= 0 && aFecha(r[t0]) == null) { cargo = cargoEnTexto(textos[t0]); nombre = CARGOS[cargo] || ''; }
        return;
      }
      const fecha = aFecha(r[c.f]), fac = vacio(r[c.fa]) ? null : aNum(r[c.fa]), tot = aNum(r[c.t]);
      const cliente = vacio(r[c.cl]) ? '' : String(r[c.cl]).replace(/\s+/g, ' ').trim();
      const imp = c.im >= 0 ? aNum(r[c.im]) : null, iva = c.iv >= 0 ? aNum(r[c.iv]) : null;
      const extra = r.slice(c.t + 1).filter(x => typeof x === 'string' && x.trim()).map(x => x.trim()).join(' | ');
      const donde = `Hoja ${hoja}, fila ${fila}`;
      if (vacio(r[c.f]) && fac == null && !cliente && (!tot)) return;
      const err = [];
      if (tot == null) err.push(vacio(r[c.t]) ? 'falta el total' : `total no válido («${r[c.t]}»)`);
      else if (tot <= 0) err.push('total en cero o negativo');
      if (!vacio(r[c.fa]) && !(fac > 0 && Number.isInteger(fac))) err.push(`número de factura no válido («${r[c.fa]}»)`);
      if (!cliente) err.push('falta el cliente');
      if (err.length) { res.errores.push(`${donde} (${nombre}${fac ? ' factura ' + fac : ''}): ${err.join(', ')}.`); return; }
      suma += tot; n++;
      if (!fecha) res.avisos.push(`${donde}: la factura ${fac || 'sin número'} no tiene fecha válida; se importa sin fecha.`);
      else if (fecha.slice(0, 4) !== '2026') res.avisos.push(`${donde}: la factura ${fac || 'sin número'} tiene fecha ${fdm(fecha)} (otro año) y se encuentra en la hoja ${hoja}; se importa con la fecha registrada.`);
      else if (mesHoja >= 0 && +fecha.slice(5, 7) !== mesHoja + 1) res.avisos.push(`${donde}: la factura ${fac || 'sin número'} tiene fecha de ${MESES_L[+fecha.slice(5, 7) - 1].toLowerCase()} y se encuentra en la hoja ${hoja}.`);
      if (imp != null && iva != null && Math.abs(imp + iva - tot) > 0.05) res.avisos.push(`${donde}: importe más IVA (${money(imp + iva)}) no coincide con el total (${money(tot)}) de la factura ${fac || 'sin número'}.`);
      if (!fac) res.avisos.push(`${donde}: «${cliente}» sin número de factura (${money(tot)}).`);
      res.filas.push({ hoja, fila, cargo_id: cargo, fecha, factura: fac, cliente, importe: imp == null ? null : r2(imp), iva: iva == null ? null : r2(iva), total: r2(tot), nota: extra });
    });
    cierra();
  });
  const vistos = {};
  res.filas.forEach(f => { if (f.factura) (vistos[f.factura] = vistos[f.factura] || []).push(f); });
  Object.values(vistos).filter(a => a.length > 1).forEach(a => {
    const igual = a.every(x => x.cargo_id === a[0].cargo_id && x.total === a[0].total);
    const lugares = a.map(f => 'hoja ' + f.hoja + ' fila ' + f.fila).join(', ');
    if (igual) { a.slice(1).forEach(f => f.rep = true); res.avisos.push(`La factura ${a[0].factura} aparece ${a.length} veces con los mismos datos (${lugares}); se importa una sola vez.`); }
    else { a.forEach(f => f.rep = true); res.errores.push(`La factura ${a[0].factura} aparece ${a.length} veces con datos distintos (${lugares}). Ninguno de esos renglones se importa hasta corregir el archivo.`); }
  });
  res.filas = res.filas.filter(f => !f.rep);
  return res;
}
function compararPagos(res) {
  const porF = {}, sinF = {};
  P.pagos.forEach(p => { if (p.factura) porF[p.factura] = p; else sinF[[p.cargo_id, p.fecha || '', norm(p.cliente), p.total.toFixed(2)].join('|')] = p; });
  const nuevos = [], iguales = [], cambios = [];
  res.filas.forEach(f => {
    const a = f.factura ? porF[f.factura] : sinF[[f.cargo_id, f.fecha || '', norm(f.cliente), f.total.toFixed(2)].join('|')];
    if (!a) { nuevos.push({ ...f, incl: true }); return; }
    const dif = [];
    if (a.cargo_id !== f.cargo_id) dif.push(['Ingeniero', CARGOS[a.cargo_id], CARGOS[f.cargo_id], a.deposito_id ? 'La factura está conciliada; al cambiar el ingeniero se desliga del depósito.' : '']);
    if ((a.fecha || '') !== (f.fecha || '')) dif.push(['Fecha', fdm(a.fecha), fdm(f.fecha)]);
    if (Math.abs(a.total - f.total) > 0.004) dif.push(['Total', money(a.total), money(f.total), a.deposito_id ? 'La factura está conciliada; al cambiar el total se desliga del depósito.' : '']);
    if (dif.length) cambios.push({ ...f, id: a.id, dif, incl: false }); else iguales.push(f);
  });
  const enArchivo = new Set(res.filas.filter(f => f.factura).map(f => f.factura));
  const soloApp = P.pagos.filter(p => p.factura && !enArchivo.has(p.factura));
  nuevos.sort((a, b) => a.cargo_id - b.cargo_id || (a.fecha || '').localeCompare(b.fecha || ''));
  return { ...res, nuevos, iguales, cambios, soloApp, vista: cambios.length ? 'cambios' : 'nuevos' };
}

/* Búsqueda de coincidencias: combinaciones de facturas del mismo ingeniero cuya suma iguala el saldo del depósito */
function subconjunto(items, objetivo, maxN) {
  const a = items.slice().sort((x, y) => y.c - x.c), suf = new Array(a.length + 1).fill(0);
  for (let i = a.length - 1; i >= 0; i--) suf[i] = suf[i + 1] + a[i].c;
  let pasos = 0, hallado = null;
  const rec = (i, rest, pick) => {
    if (hallado || pasos++ > 200000) return;
    if (rest === 0) { hallado = pick.slice(); return; }
    if (i >= a.length || pick.length >= maxN || rest < 0 || rest > suf[i]) return;
    pick.push(a[i]); rec(i + 1, rest - a[i].c, pick); pick.pop(); rec(i + 1, rest, pick);
  };
  rec(0, objetivo, []); return hallado;
}
function proponer() {
  const lig = ligadoPor(), usados = new Set(), out = [];
  const libres = P.pagos.filter(p => !p.deposito_id && p.fecha);
  const deps = P.dep.map(d => ({ ...d, rest: c100(d.monto) - (lig[d.id] || 0) })).filter(d => d.rest > 0 && d.cargo_id);
  [['Misma fecha', 0, 12, true], ['Fecha cercana (±5 días)', 5, 6, true], ['Mismo mes', 31, 4, false]].forEach(([crit, dd, maxN, marca]) => {
    deps.forEach(d => {
      if (d.hecho) return;
      const cand = libres.filter(p => !usados.has(p.id) && p.cargo_id === d.cargo_id && dias(p.fecha, d.fecha) <= dd);
      const s = subconjunto(cand.map(p => ({ id: p.id, c: c100(p.total) })), d.rest, maxN);
      if (s && s.length) { s.forEach(x => usados.add(x.id)); d.hecho = true; out.push({ dep: d, ids: s.map(x => x.id), crit, incl: marca }); }
    });
  });
  return out;
}

        const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: false, cellNF: false, cellText: false });
        const r = leerPagos(wb);
        if (!r.filas.length && !r.errores.length) { P.imp = null; return $('#pres').innerHTML = `<div class="msg err">No se encontraron facturas. Encabezados requeridos: FECHA, FAC., CLIENTE y TOTAL, con el nombre del ingeniero sobre cada bloque. Si el archivo corresponde a folios de egresos, utilizar «Importar Excel».${r.ignorados.length ? '<br>' + r.ignorados.map(esc).join('<br>') : ''}</div>`; }
        P.imp = { ...compararPagos(r), archivo: f.name };
      } catch (er) { P.imp = null; return $('#pres').innerHTML = `<div class="msg err">Error al leer el archivo: ${esc(er.message)}</div>`; }
      vConcil();
    };
    if (!im) return;
    document.querySelectorAll('[data-v]').forEach(b => b.onclick = e => { e.preventDefault(); im.vista = b.dataset.v; vConcil(); });
    document.querySelectorAll('input[data-n]').forEach(c => c.onchange = () => { im.nuevos[+c.dataset.n].incl = c.checked; vConcil(); });
    document.querySelectorAll('input[data-c]').forEach(c => c.onchange = () => { im.cambios[+c.dataset.c].incl = c.checked; vConcil(); });
    if ($('#todosN')) $('#todosN').onchange = e => { im.nuevos.forEach(x => x.incl = e.target.checked); vConcil(); };
    $('#pgg').onclick = async () => {
      const nuevos = im.nuevos.filter(x => x.incl), cambios = im.cambios.filter(x => x.incl);
      if (cambios.length && !confirm(`Se actualizarán ${cambios.length} factura(s) existentes con los datos del archivo. El valor anterior se conservará en la bitácora. ¿Continuar?`)) return;
      const b = $('#pgg'); b.disabled = true; const lote = 'pagos-' + new Date().toISOString().replace(/\D/g, '').slice(0, 14), tot = { nuevos: 0, cambios: 0, omitidos: [] };
      const N = nuevos.map(x => ({ cargo_id: x.cargo_id, fecha: x.fecha, factura: x.factura, cliente: x.cliente, importe: x.importe, iva: x.iva, total: x.total, nota: x.nota, hoja: x.hoja }));
      const C = cambios.map(x => ({ id: x.id, cargo_id: x.cargo_id, fecha: x.fecha, cliente: x.cliente, importe: x.importe, iva: x.iva, total: x.total }));
      try {
        for (let i = 0; i < Math.max(N.length, C.length); i += 150) {
          b.textContent = `Guardando… ${Math.min(i + 150, Math.max(N.length, C.length))} de ${Math.max(N.length, C.length)}`;
          const { data, error } = await sb.rpc('pagos_sincronizar', { p_nuevos: N.slice(i, i + 150), p_cambios: C.slice(i, i + 150), p_lote: lote });
          if (error) throw error;
          tot.nuevos += data.nuevos; tot.cambios += data.cambios; tot.omitidos.push(...(data.omitidos || []));
        }
      } catch (er) {
        b.disabled = false; b.textContent = 'Reintentar';
        return $('#pres').innerHTML = `<div class="msg err">${esc(er.message || er)}<br>Guardadas antes del error: ${tot.nuevos} nuevas y ${tot.cambios} cambios. Al cargar de nuevo el mismo archivo, lo ya guardado aparecerá en «Sin cambios» sin duplicarse.</div>`;
      }
      P.imp = null; await cargarPagos(); await vConcil();
      $('#pres').innerHTML = `<div class="msg ok">Archivo procesado: ${tot.nuevos} factura(s) nueva(s) y ${tot.cambios} actualizada(s).${tot.omitidos.length ? `<br><b>No guardadas (${tot.omitidos.length}):</b><br>${tot.omitidos.map(esc).join('<br>')}` : ''}</div>`;
    };
  }
}

/* Actualización en vivo: revisa cada 45 s (y al volver a la pestaña) si hay folios nuevos */
let _ref = false, _tick = 0;
async function refrescar(forzar) {
  if (_ref || document.hidden || !S.perfil || !['folios', 'ingresos', 'cancun', 'acumulado'].includes(S.tab)) return;
  const ae = document.activeElement; if (ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName)) return;
  if (document.getElementById('dlg')) return;
  _ref = true;
  try {
    const firma = () => S.rows.length + ':' + S.rows.reduce((m, r) => Math.max(m, r.id), 0);
    /* Sondeo ligero (2 consultas): solo se recarga todo si hay folios nuevos o cada 3er ciclo / al volver a la pestaña */
    const sonda = async () => { const [c, m] = await Promise.all([sb.from('platon_movimientos').select('id', { count: 'exact', head: true }).eq('activo', true), sb.from('platon_movimientos').select('id').eq('activo', true).order('id', { ascending: false }).limit(1)]); return c.error || m.error ? null : c.count + ':' + ((m.data[0] || {}).id || 0); };
    _tick++; if (!forzar && _tick % 3 !== 0) { const ya = await sonda(); if (ya && ya === firma()) return; }
    const antes = firma(); await cargar();
    if (firma() !== antes) { const y = window.scrollY; shell(); window.scrollTo(0, y); }
  } catch (e) { } finally { _ref = false; }
}
setInterval(() => refrescar(), 45000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refrescar(true); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
boot();
</script>
