<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#17222f;--mut:#667386;--line:#dfe5ee;--pri:#14345c;--pri2:#1f4f8a;--gold:#c8962b;--ok:#18794e;--okbg:#e3f4eb;--bad:#b3261e;--badbg:#fbe9e7;--chip:#e8eef7}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{background:#14345c;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 0;position:sticky;top:0;z-index:5}

input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%}
label{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin:10px 0 4px}

.btn.gold{background:var(--gold);color:#1b1400}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}

th{position:sticky;top:0;background:var(--chip);font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}

<script>
'use strict';
const SUPABASE_URL = 'https://hbttxvanyqczspljtqpz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_J4abyTF0BPq47eBTVLjIFQ_5-x2HOiJ';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const $ = (s, r = document) => r.querySelector(s);

const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const CARGOS = {}, CARGO_ID = {};
const limpia = n => String(n || '').replace(/^ING\.\s*/i, '').trim().toUpperCase();
const S = { arch: {}, acum: [], cancun: [], cn: { sub: 'EFECTIVO', tipo: 'EGRESO', mes: '', q: '', villa: '' }, ac: { semana: '', cargo: 0, q: '', desde: '', sel: {} }, det: null, unidad: '', perfil: null, rows: [], cruce: {}, tab: 'folios', cargo: 0, mes: '', q: '', anio: 2026, imp: null };

const puedeImpPl = () => !!(S.perfil && S.perfil.solo_folios && S.perfil.puede_importar_platon);

/* ---------- datos ---------- */
async function cargar() {
  const { data: cg } = await sb.from('cargos').select('id,nombre,activo,solo_caja').order('id');
  (cg || []).filter(c => c.activo && !c.solo_caja).forEach(c => { CARGOS[c.id] = limpia(c.nombre); CARGO_ID[limpia(c.nombre)] = c.id; });
  let all = [], from = 0;
  for (;;) {
    const { data, error } = await sb.from('platon_movimientos').select('id,unidad,cargo_id,tipo,folio,fecha,concepto,categoria,monto,origen,lote,nota,sin_factura,pct_extra,total_pagar,revisado_en,creado_por,creado_en').eq('activo', true).order('fecha').order('id').range(from, from + 999);
    if (error) throw error;

  const cr = {};

      const { data, error } = await sb.from('folio_pago').select('origen_app,clave,medio,cheques,semana_efectivo,monto_efectivo,ref_medio,conflicto').range(from, from + 999);
      if (error) break;
      data.forEach(r => { if (r.origen_app === 'CANCUN') S.fpc[r.clave] = r; else S.fp[r.clave] = r; });

    const { data: sg } = await sb.from('folio_sugerencias').select('mov_id,tipo_sugerido,referencia,fecha_ref,ref_id,dif_dias,orden').lte('orden', 3).order('orden');
    (sg || []).forEach(x => (S.sug[x.mov_id] = S.sug[x.mov_id] || []).push(x));
  } catch (e) { }
  await cargarExtra();
}
async function cargarExtra() {
  const ar = {}; let from = 0;
  for (;;) {
    const { data, error } = await sb.from('platon_archivos').select('id,mov_id,tipo,path,nombre,subido_en').eq('activo', true).range(from, from + 999);
    if (error) break;
    data.forEach(a => { (ar[a.mov_id] = ar[a.mov_id] || {})[a.tipo] = a; });
    if (data.length < 1000) break; from += 1000;
  }
  S.arch = ar;
  if (!soloFolios()) {
    let ac = []; from = 0;
    for (;;) {
      const { data, error } = await sb.from('platon_acumulado').select('id,semana,mov_id,monto,nota,creado_en').eq('activo', true).range(from, from + 999);
      if (error) break;
      ac = ac.concat(data); if (data.length < 1000) break; from += 1000;
    }
    S.acum = ac;
  }
  if (veCancun()) {
    let cn = []; from = 0;
    for (;;) {
      const { data, error } = await sb.from('cancun_movimientos').select('id,fecha,cargo,folio,concepto,monto,pago,tipo,categoria,villa,comentarios,depto').order('fecha', { ascending: false }).range(from, from + 999);
      if (error) break;
      cn = cn.concat(data); if (data.length < 1000) break; from += 1000;
    }
    S.cancun = cn;
    S.srv = []; S.villasBaja = [];
    try {
      const a = await sb.from('cancun_servicios_estado').select('*').order('limite');
      if (!a.error) S.srv = a.data || [];
      const b = await sb.from('cancun_villas_estado').select('*').eq('activa', false).order('villa');
      if (!b.error) S.villasBaja = b.data || [];
    } catch (e) { }
  }
}
const unidades = () => [...new Set(S.rows.map(r => r.unidad))].sort();
const cargosDe = () => [...new Set(S.rows.filter(r => !S.unidad || r.unidad === S.unidad).map(r => r.cargo_id))].sort((a, b) => (CARGOS[a] || '').localeCompare(CARGOS[b] || ''));
const nomU = u => ({ PLATON: 'OF PLATON', CANCUN: 'Cancún', JOCRIS: 'JOCRIS' }[u] || u.charAt(0) + u.slice(1).toLowerCase());
const filtradas = (tipo) => S.rows.filter(r => r.tipo === tipo && (!S.unidad || r.unidad === S.unidad) && (!S.cargo || r.cargo_id === S.cargo) && (!S.mes || r.fecha.slice(5, 7) === S.mes) &&
  (!S.q || (r.concepto + ' ' + (r.categoria || '') + ' ' + (r.folio || '')).toLowerCase().includes(S.q.toLowerCase())));

/* ---------- login ---------- */
function renderLogin(msg) {
  $('#app').innerHTML = `<div class="login"><div class="card"><div class="big">Folios</div><div class="mut">Egresos e ingresos</div>
  ${msg ? `<div class="msg err">${esc(msg)}</div>` : ''}
  <form id="fl"><label>Correo</label><input id="lm" type="email" autocomplete="username" required><label>Contraseña</label><div style="position:relative"><input id="lp" type="password" autocomplete="current-password" required style="padding-right:44px"><button type="button" id="ojo" aria-label="Mostrar contraseña" title="Mostrar contraseña" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:34px;border:0;background:none;cursor:pointer;color:#5b6b82;display:flex;align-items:center;justify-content:center"><svg id="ojoi" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>

    if (error) return renderLogin(/no autorizado/i.test(error.message) ? 'El correo no está autorizado para esta aplicación.' : 'No fue posible crear el acceso: ' + error.message);
    if (!data.session) return renderLogin('Acceso creado. Si el sistema lo solicita, confirmar el correo recibido y después iniciar sesión.');
    boot();
  };
  $('#fl').onsubmit = async e => {
    e.preventDefault(); const b = $('#lb'); b.disabled = true; b.textContent = 'Iniciando sesión…';
    const { error } = await sb.auth.signInWithPassword({ email: $('#lm').value.trim().toLowerCase(), password: $('#lp').value });
    if (error) return renderLogin(/invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : 'No fue posible iniciar sesión: ' + error.message);
    boot();
  };
}
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  const { data: p, error } = await sb.from('perfiles').select('*').eq('id', session.user.id).maybeSingle();
  if (error) { $('#app').innerHTML = '<div class="login"><div class="msg err">Sin conexión con el servidor.</div></div>'; return; }
  if (!p || !p.activo) { await sb.auth.signOut(); return renderLogin('Usuario inactivo. Contactar al administrador del sistema.'); }
  S.perfil = p;
  $('#app').innerHTML = '<div class="login"><div class="msg info">Cargando…</div></div>';
  try { await cargar(); } catch (e) { $('#app').innerHTML = `<div class="login"><div class="msg err">Error al cargar la información: ${esc(e.message || e)}</div></div>`; return; }
  shell();
}

/* ---------- estructura ---------- */
function shell() {
  const tabs = soloFolios() ? [['folios', 'Mis folios'], ['capturar', 'Capturar'], ...(puedeImpPl() ? [['importar', 'Importar Excel']] : [])] : [['folios', 'Folios'], ['ingresos', 'Ingresos']];
  if (veAcumulado()) tabs.push(['acumulado', 'Acumulado semanal']);
  if (puedeCapturar() && !soloFolios()) tabs.push(['capturar', 'Capturar'], ['importar', 'Importar Excel']);
  $('#app').innerHTML = `<header><div class="top"><h1>Folios<small>${soloFolios() ? 'Platón' : 'egresos e ingresos'}</small></h1>
    <div class="who">${esc(S.perfil.nombre || S.perfil.correo || '')}<br><a href="#" id="out" style="color:#fff">Cerrar sesión</a></div></div>
    <nav>${tabs.map(t => `<button data-t="${t[0]}" class="${S.tab === t[0] ? 'on' : ''}">${t[1]}</button>`).join('')}</nav></header>${bannerSrv()}<main id="m"></main>`;
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; shell(); });
  { const bs = $('#bsrv'); if (bs) bs.onclick = () => { S.tab = 'folios'; S.unidad = 'JOCRIS'; S.cargo = -1; shell(); }; }
  $('#out').onclick = async e => { e.preventDefault(); await sb.auth.signOut(); location.reload(); };
  if (S.tab === 'resumen') S.tab = 'folios';
  { const us = unidades(); if (!us.includes(S.unidad)) { S.unidad = us.includes('PLATON') ? 'PLATON' : (us[0] || ''); S.cargo = 0; } }
  if (soloFolios() && !['folios', 'capturar', ...(puedeImpPl() ? ['importar'] : [])].includes(S.tab)) S.tab = 'folios';
  if (S.tab === 'cancun') S.tab = 'folios';
  if (S.tab === 'acumulado' && !veAcumulado()) S.tab = 'folios';
  ({ resumen: vResumen, folios: vFolios, ingresos: vIngresos, concil: vConcil, capturar: vCapturar, importar: vImportar, cancun: vCancun, acumulado: vAcumulado })[S.tab]();
  if (S.det) abreDetalle(S.det);
}
function fijaCargo() { if (S.cargo === -1 && S.unidad === 'JOCRIS' && veCancun()) return; const cs = cargosDe(); if (!cs.includes(S.cargo)) S.cargo = cs.includes(CARGO_ID['EGBERT']) ? CARGO_ID['EGBERT'] : (cs[0] || 0); }
function filtrosHTML(conBuscar, sinTodos, opc) {
  opc = opc || {};
  const meses = MESES.map((m, i) => `<option value="${String(i + 1).padStart(2, '0')}" ${S.mes === String(i + 1).padStart(2, '0') ? 'selected' : ''}>${m}</option>`).join('');
  const us = unidades(); if (!us.includes(S.unidad)) { S.unidad = us.includes('PLATON') ? 'PLATON' : (us[0] || ''); S.cargo = 0; }
  const conCan = S.unidad === 'JOCRIS' && veCancun() && !opc.sinCancun;
  if (S.cargo && !(S.cargo === -1 && conCan) && !cargosDe().includes(S.cargo)) S.cargo = 0;
  const opsC = [...(sinTodos ? [] : [[0, 'Todos los cargos']]), ...cargosDe().map(c => [c, CARGOS[c]]), ...(conCan ? [[-1, 'CANCÚN']] : [])];
  return `<div class="tb">${us.length > 1 && !opc.sinUnidades ? `<div class="chips">${us.map(u => [u, nomU(u)]).map(u => `<button class="chip ${S.unidad === u[0] ? 'on' : ''}" data-u="${u[0]}">${u[1]}</button>`).join('')}</div>` : ''}
  <select id="fcg" title="Cargo">${opsC.map(c => `<option value="${c[0]}" ${S.cargo === c[0] ? 'selected' : ''}>${c[0] === 0 ? c[1] : 'Cargo: ' + c[1]}</option>`).join('')}</select>
  ${opc.soloChips ? '' : `<select id="fm"><option value="">Todo el año</option>${meses}</select>${conBuscar ? `<input id="fq" placeholder="Buscar concepto o folio…" value="${esc(S.q)}">` : ''}`}</div>`;
}
function ligaFiltros(rerender) {
  document.querySelectorAll('.chip[data-u]').forEach(b => b.onclick = () => { S.unidad = b.dataset.u; S.cargo = 0; rerender(); });

/* ---------- Importar Excel ---------- */
/* Lee dos formatos:
   1) Formato de la oficina (FOLIOS_2026.xls): una hoja por mes y, dentro, un bloque por cargo
      ("ING. EGBERT SIERCKE", "ING. RENE", "ING. OMAR ELIZONDO") con FECHA | N° FOLIO | CONCEPTO | IMPORTE y su fila TOTAL.
   2) Formato de tabla: encabezados FECHA, CARGO, CONCEPTO (o CLIENTE), MONTO y opcionales FOLIO, TIPO, CATEGORIA, UNIDAD.
   Nunca borra ni renumera: los folios nuevos se agregan con su número, los que ya existen se comparan y
   las diferencias solo se aplican si la persona las marca (queda bitácora con el valor anterior). */
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
const MESES_L = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
function aFecha(v) {

  if (typeof v === 'number') { if (v < 20000 || v > 80000) return null; return new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10); }
  if (v instanceof Date) return isNaN(v) ? null : `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}`;
  const s = String(v).trim(); let m, y, mo, d;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) [y, mo, d] = [m[1], m[2], m[3]];
  else if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))) [y, mo, d] = [m[3].length === 2 ? '20' + m[3] : m[3], m[2], m[1]];
  else if ((m = norm(s).match(/^(\d{1,2})[-\/ ]+(?:DE )?([A-Z]{3})[A-Z]*[-\/ ]+(?:DE )?(\d{2,4})$/))) { const i = MESES.indexOf(m[2].toLowerCase()); if (i < 0) return null; [y, mo, d] = [m[3].length === 2 ? '20' + m[3] : m[3], String(i + 1), m[1]]; }
  else return null;
  const f = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`, t = new Date(f + 'T12:00:00Z');
  return isNaN(t) || t.toISOString().slice(0, 10) !== f ? null : f;
}
const aNum = v => { if (typeof v === 'number') return isFinite(v) ? v : null; const s = String(v == null ? '' : v).replace(/[$,\s]/g, '').replace(/^\((.*)\)$/, '-$1'); if (!/^-?\d+(\.\d+)?$/.test(s)) return null; return parseFloat(s); };
const r2 = n => Math.round(n * 100) / 100;
const vacio = v => v == null || String(v).trim() === '';

/* Categoría sugerida para folios nuevos: la última que se usó con el mismo concepto en ese cargo, luego en cualquier cargo, luego por palabra clave */
const CAT_REGLAS = [[/HORAS EXTRA|RAYA|PRESTAMO|VACACION|FINIQUITO|AGUINALDO/, 'RAYAS'], [/IMSS|INFONAVIT|SEGURO SOCIAL/, 'IMSS'], [/TELMEX|TELCEL|INTERNET|TELEFON|IZZI|DIPSA/, 'TELEFONIA - INTERNET'],
  [/GASOLIN|VALES/, 'GASOLINA'], [/RENTA/, 'RENTA OFICINA'], [/AGUA/, 'AGUA'], [/CFE|LUZ/, 'LUZ'], [/PAPELERIA|TONER/, 'PAPELERIA'], [/MEDIC|MAFRE|MAPFRE/, 'GASTOS MEDICOS'],
  [/VIATICO/, 'VIATICOS'], [/REPARACION|MECANIC|AFINACION|REFRENDO|PLACAS|SEGURO.*AUTO|LLANTA|BALATA|MERIVA|POINTER|OPTIMA|KIA|LUV|CORRALON|CAMIONETA/, 'MTTO AUTOS']];
function catSugerida(cargoId, concepto) {

    const usada = S.rows.find(r => r.cargo_id === cargoId && r.categoria && (norm(r.categoria) === cat || (cat === 'MTTO AUTOS' && norm(r.categoria) === 'MTTO AUTO') || (cat === 'LUZ' && norm(r.categoria) === 'CFE')));

function comparar(res) {

    if (ya[k] > 0) { ya[k]--; iguales.push(f); } else nuevos.push({ ...f, categoria: f.tipo === 'EGRESO' ? (f.categoria || catSugerida(f.cargo_id, f.concepto)) : '', incl: true });

  const enArchivo = new Set(res.filas.filter(f => f.folio).map(f => f.unidad + '|' + f.cargo_id + '|' + f.folio));
  const soloApp = S.rows.filter(r => r.tipo === 'EGRESO' && meses.has(r.unidad + '|' + r.cargo_id + '|' + r.fecha.slice(0, 7)) && !enArchivo.has(r.unidad + '|' + r.cargo_id + '|' + r.folio));

  res.filas.filter(f => f.folio).forEach(f => (porCargo[f.unidad + '|' + f.cargo_id] = porCargo[f.unidad + '|' + f.cargo_id] || new Set()).add(f.folio));

  });

        const { data, error } = await sb.rpc('folios_sincronizar', { p_unidad: S.impU || 'PLATON', p_nuevos: N.slice(i, i + 150), p_cambios: C.slice(i, i + 150), p_lote: lote });
        if (error) throw error;
        tot.nuevos += data.nuevos; tot.cambios += data.cambios; tot.omitidos.push(...(data.omitidos || []));
      }
    } catch (er) {
      b.disabled = false; b.textContent = 'Reintentar';
      return $('#res').innerHTML = `<div class="msg err">${esc(er.message || er)}<br>Registros guardados antes del error: ${tot.nuevos} nuevos y ${tot.cambios} cambios. Al cargar de nuevo el mismo archivo, lo ya guardado aparecerá en «Sin cambios» sin duplicarse.</div>`;
    }
    S.imp = null; await cargar(); vImportar();
    $('#res').innerHTML = `<div class="msg ok">Importación concluida: ${tot.nuevos} movimiento(s) nuevo(s) y ${tot.cambios} folio(s) actualizado(s).${tot.omitidos.length ? `<br><b>Registros no guardados (${tot.omitidos.length}):</b><br>${tot.omitidos.map(esc).join('<br>')}` : ''}</div>`;
  };
}

/* ---------- Conciliación de ingresos: banco (CSV) y archivo PAGOS de la oficina ---------- */
const P = { pagos: [], dep: null, imp: null, vista: 'resumen', cargo: 0, mes: '', est: '', q: '', sel: null, prop: null, cargado: false, ok: '' };
const ING_N = ['EGBERT', 'OMAR', 'RENE'];
const ingIds = () => ING_N.map(n => CARGO_ID[n]).filter(Boolean);
const puedeConciliar = () => S.perfil && ['administrador', 'contador'].includes(S.perfil.rol);
const fdm = f => f ? f.split('-').reverse().join('/') : 'sin fecha';
const c100 = n => Math.round(Number(n) * 100);
const mesDe = f => f && f.slice(0, 4) === '2026' ? f.slice(5, 7) : '00';
const dias = (a, b) => Math.abs((new Date(a + 'T12:00:00Z') - new Date(b + 'T12:00:00Z')) / 864e5);
async function cargarPagos() {
  let all = [], from = 0;
  for (;;) {
    const { data, error } = await sb.from('platon_pagos').select('*').eq('activo', true).order('id').range(from, from + 999);
    if (error) throw error;
    all = all.concat(data); if (data.length < 1000) break; from += 1000;
  }
  P.pagos = all.map(p => ({ ...p, total: Number(p.total) }));
  let d = []; from = 0;
  for (;;) {
    const { data, error } = await sb.from('ingresos').select('id,fecha,monto,pagador,concepto,categoria').in('categoria', ING_N).order('fecha').range(from, from + 999);
    if (error) { d = null; break; }
    d = d.concat(data); if (data.length < 1000) break; from += 1000;
  }
  P.dep = d && d.length ? d.map(x => ({ ...x, monto: Number(x.monto), cargo_id: CARGO_ID[x.categoria] })).filter(x => x.cargo_id) : null;
  P.cargado = true;
}
const ligadoPor = () => { const m = {}; P.pagos.forEach(p => { if (p.deposito_id) m[p.deposito_id] = (m[p.deposito_id] || 0) + c100(p.total); }); return m; };

/* Lectura del archivo PAGOS: una hoja por mes y un bloque por ingeniero (FECHA, FAC., CLIENTE, IMPORTE, I.V.A, TOTAL) */
function leerPagos(wb) {
  const res = { filas: [], errores: [], avisos: [], ignorados: [] };
  wb.SheetNames.forEach(hoja => {
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[hoja], { header: 1, raw: true, defval: null, blankrows: true });
    const mesHoja = MESES_L.findIndex(m => norm(hoja).includes(m));
    let cargo = 0, nombre = '', c = null, suma = 0, n = 0, total = null;
    const cierra = () => { if (c && n && total != null && Math.abs(r2(suma) - r2(total)) > 0.02) res.avisos.push(`Hoja ${hoja}: la suma de las facturas de ${nombre} (${money(suma)}) no coincide con el TOTAL del Excel (${money(total)}).`); c = null; suma = 0; n = 0; total = null; };
    filas.forEach((r, i) => {
      if (!r) return; const fila = i + 1, textos = r.map(x => typeof x === 'string' ? norm(x) : '');
      if (textos.includes('FECHA') && textos.includes('TOTAL')) {
        cierra();
        const col = (...ns) => textos.findIndex(t => ns.includes(t.replace(/[. ]/g, '')));
        c = { f: textos.indexOf('FECHA'), fa: textos.findIndex(t => t.startsWith('FAC')), cl: textos.indexOf('CLIENTE'), im: col('IMPORTE'), iv: col('IVA'), t: textos.indexOf('TOTAL') };
        if (!cargo || c.fa < 0 || c.cl < 0) { res.ignorados.push(`Hoja ${hoja}, fila ${fila}: tabla sin ingeniero reconocido o sin columnas FAC. y CLIENTE; no se importa.`); c = null; }
        return;
      }
      if (r.every(vacio)) return;
      const tt = textos.findIndex(t => t.startsWith('TOTAL'));
      if (tt >= 0) { if (c) { const v = aNum(r[c.t]); if (v != null) total = v; } cierra(); return; }
      if (!c) {
        const t0 = textos.slice(0, 3).findIndex(t => t && cargoEnTexto(t));
        if (t0 >= 0 && aFecha(r[t0]) == null) { cargo = cargoEnTexto(textos[t0]); nombre = CARGOS[cargo] || ''; }
        return;
      }
      const fecha = aFecha(r[c.f]), fac = vacio(r[c.fa]) ? null : aNum(r[c.fa]), tot = aNum(r[c.t]);
      const cliente = vacio(r[c.cl]) ? '' : String(r[c.cl]).replace(/\s+/g, ' ').trim();
      const imp = c.im >= 0 ? aNum(r[c.im]) : null, iva = c.iv >= 0 ? aNum(r[c.iv]) : null;
      const extra = r.slice(c.t + 1).filter(x => typeof x === 'string' && x.trim()).map(x => x.trim()).join(' | ');
      const donde = `Hoja ${hoja}, fila ${fila}`;
      if (vacio(r[c.f]) && fac == null && !cliente && (!tot)) return;
      const err = [];
      if (tot == null) err.push(vacio(r[c.t]) ? 'falta el total' : `total no válido («${r[c.t]}»)`);
      else if (tot <= 0) err.push('total en cero o negativo');
      if (!vacio(r[c.fa]) && !(fac > 0 && Number.isInteger(fac))) err.push(`número de factura no válido («${r[c.fa]}»)`);
      if (!cliente) err.push('falta el cliente');
      if (err.length) { res.errores.push(`${donde} (${nombre}${fac ? ' factura ' + fac : ''}): ${err.join(', ')}.`); return; }
      suma += tot; n++;
      if (!fecha) res.avisos.push(`${donde}: la factura ${fac || 'sin número'} no tiene fecha válida; se importa sin fecha.`);
      else if (fecha.slice(0, 4) !== '2026') res.avisos.push(`${donde}: la factura ${fac || 'sin número'} tiene fecha ${fdm(fecha)} (otro año) y se encuentra en la hoja ${hoja}; se importa con la fecha registrada.`);
      else if (mesHoja >= 0 && +fecha.slice(5, 7) !== mesHoja + 1) res.avisos.push(`${donde}: la factura ${fac || 'sin número'} tiene fecha de ${MESES_L[+fecha.slice(5, 7) - 1].toLowerCase()} y se encuentra en la hoja ${hoja}.`);
      if (imp != null && iva != null && Math.abs(imp + iva - tot) > 0.05) res.avisos.push(`${donde}: importe más IVA (${money(imp + iva)}) no coincide con el total (${money(tot)}) de la factura ${fac || 'sin número'}.`);
      if (!fac) res.avisos.push(`${donde}: «${cliente}» sin número de factura (${money(tot)}).`);
      res.filas.push({ hoja, fila, cargo_id: cargo, fecha, factura: fac, cliente, importe: imp == null ? null : r2(imp), iva: iva == null ? null : r2(iva), total: r2(tot), nota: extra });
    });
    cierra();
  });
  const vistos = {};
  res.filas.forEach(f => { if (f.factura) (vistos[f.factura] = vistos[f.factura] || []).push(f); });
  Object.values(vistos).filter(a => a.length > 1).forEach(a => {
    const igual = a.every(x => x.cargo_id === a[0].cargo_id && x.total === a[0].total);
    const lugares = a.map(f => 'hoja ' + f.hoja + ' fila ' + f.fila).join(', ');
    if (igual) { a.slice(1).forEach(f => f.rep = true); res.avisos.push(`La factura ${a[0].factura} aparece ${a.length} veces con los mismos datos (${lugares}); se importa una sola vez.`); }
    else { a.forEach(f => f.rep = true); res.errores.push(`La factura ${a[0].factura} aparece ${a.length} veces con datos distintos (${lugares}). Ninguno de esos renglones se importa hasta corregir el archivo.`); }
  });
  res.filas = res.filas.filter(f => !f.rep);
  return res;
}
function compararPagos(res) {
  const porF = {}, sinF = {};
  P.pagos.forEach(p => { if (p.factura) porF[p.factura] = p; else sinF[[p.cargo_id, p.fecha || '', norm(p.cliente), p.total.toFixed(2)].join('|')] = p; });
  const nuevos = [], iguales = [], cambios = [];
  res.filas.forEach(f => {
    const a = f.factura ? porF[f.factura] : sinF[[f.cargo_id, f.fecha || '', norm(f.cliente), f.total.toFixed(2)].join('|')];
    if (!a) { nuevos.push({ ...f, incl: true }); return; }
    const dif = [];
    if (a.cargo_id !== f.cargo_id) dif.push(['Ingeniero', CARGOS[a.cargo_id], CARGOS[f.cargo_id], a.deposito_id ? 'La factura está conciliada; al cambiar el ingeniero se desliga del depósito.' : '']);
    if ((a.fecha || '') !== (f.fecha || '')) dif.push(['Fecha', fdm(a.fecha), fdm(f.fecha)]);
    if (Math.abs(a.total - f.total) > 0.004) dif.push(['Total', money(a.total), money(f.total), a.deposito_id ? 'La factura está conciliada; al cambiar el total se desliga del depósito.' : '']);
    if (dif.length) cambios.push({ ...f, id: a.id, dif, incl: false }); else iguales.push(f);
  });
  const enArchivo = new Set(res.filas.filter(f => f.factura).map(f => f.factura));
  const soloApp = P.pagos.filter(p => p.factura && !enArchivo.has(p.factura));
  nuevos.sort((a, b) => a.cargo_id - b.cargo_id || (a.fecha || '').localeCompare(b.fecha || ''));
  return { ...res, nuevos, iguales, cambios, soloApp, vista: cambios.length ? 'cambios' : 'nuevos' };
}

/* Búsqueda de coincidencias: combinaciones de facturas del mismo ingeniero cuya suma iguala el saldo del depósito */
function subconjunto(items, objetivo, maxN) {
  const a = items.slice().sort((x, y) => y.c - x.c), suf = new Array(a.length + 1).fill(0);
  for (let i = a.length - 1; i >= 0; i--) suf[i] = suf[i + 1] + a[i].c;
  let pasos = 0, hallado = null;
  const rec = (i, rest, pick) => {
    if (hallado || pasos++ > 200000) return;
    if (rest === 0) { hallado = pick.slice(); return; }
    if (i >= a.length || pick.length >= maxN || rest < 0 || rest > suf[i]) return;
    pick.push(a[i]); rec(i + 1, rest - a[i].c, pick); pick.pop(); rec(i + 1, rest, pick);
  };
  rec(0, objetivo, []); return hallado;
}
function proponer() {
  const lig = ligadoPor(), usados = new Set(), out = [];
  const libres = P.pagos.filter(p => !p.deposito_id && p.fecha);
  const deps = P.dep.map(d => ({ ...d, rest: c100(d.monto) - (lig[d.id] || 0) })).filter(d => d.rest > 0 && d.cargo_id);
  [['Misma fecha', 0, 12, true], ['Fecha cercana (±5 días)', 5, 6, true], ['Mismo mes', 31, 4, false]].forEach(([crit, dd, maxN, marca]) => {
    deps.forEach(d => {
      if (d.hecho) return;
      const cand = libres.filter(p => !usados.has(p.id) && p.cargo_id === d.cargo_id && dias(p.fecha, d.fecha) <= dd);
      const s = subconjunto(cand.map(p => ({ id: p.id, c: c100(p.total) })), d.rest, maxN);
      if (s && s.length) { s.forEach(x => usados.add(x.id)); d.hecho = true; out.push({ dep: d, ids: s.map(x => x.id), crit, incl: marca }); }
    });
  });
  return out;
}

    cuerpo = `${P.ok ? `<div class="msg ok">${esc(P.ok)}</div>` : ''}${filtroC}<div class="sticky-f">${mesesOpt}<select id="pe"><option value="">Con diferencia</option><option value="todos" ${P.est === 'todos' ? 'selected' : ''}>Todos</option></select><input id="pq" placeholder="Buscar pagador o concepto…" value="${esc(P.q)}"></div>
      ${puedeConciliar() ? `<div class="row" style="margin-bottom:8px"><button class="btn" id="pbus">Buscar coincidencias automáticas</button><button class="btn sec" id="pxl">Descargar Excel</button></div>` : ''}${propHTML}${panel}
      <div class="tw"><table><thead><tr><th>Fecha</th><th>Ingeniero</th><th>Pagador</th><th class="n">Monto</th><th class="n">Ligado</th><th class="n">Diferencia</th>${puedeConciliar() ? '<th></th>' : ''}</tr></thead><tbody>
      ${rows.map(d => `<tr><td>${fdm(d.fecha)}</td><td>${CARGOS[d.cargo_id]}</td><td class="wrap">${esc((d.pagador || '').replace(/^\d+-[A-Z ]+ DE /, ''))}<div class="mut" style="font-size:12px">${esc(d.concepto || '')}</div></td><td class="n">${money(d.monto)}</td><td class="n">${d.lig ? money(d.lig) : '—'}</td><td class="n ${Math.abs(d.dif) > 0.004 ? 'neg' : 'pos'}">${Math.abs(d.dif) > 0.004 ? money(d.dif) : 'Cuadra'}</td>${puedeConciliar() ? `<td><a href="#" data-sel="${d.id}">Ligar</a></td>` : ''}</tr>`).join('') || '<tr><td colspan="7" class="mut">Sin depósitos con diferencia.</td></tr>'}</tbody></table></div>`;
    P._rows = rows;
  } else {
    const im = P.imp;
    const nN = im ? im.nuevos.filter(x => x.incl).length : 0, nC = im ? im.cambios.filter(x => x.incl).length : 0;
    const pest = (k, l, n, cls) => `<button class="chip ${im.vista === k ? 'on' : ''}" data-v="${k}">${l} <b class="${cls || ''}">${n}</b></button>`;
    const tabla = () => {
      if (im.vista === 'nuevos') return im.nuevos.length ? `<div class="tw"><table><thead><tr><th><input type="checkbox" id="todosN" ${im.nuevos.every(x => x.incl) ? 'checked' : ''} style="width:auto"></th><th>Ingeniero</th><th class="n">Factura</th><th>Fecha</th><th>Cliente</th><th class="n">Total</th><th>Hoja</th></tr></thead><tbody>
        ${im.nuevos.map((x, i) => `<tr style="${x.incl ? '' : 'opacity:.5'}"><td><input type="checkbox" data-n="${i}" ${x.incl ? 'checked' : ''} style="width:auto"></td><td>${CARGOS[x.cargo_id]}</td><td class="n folio">${x.factura || '<span class="mut">s/n</span>'}</td><td>${fdm(x.fecha)}</td><td class="wrap">${esc(x.cliente)}${x.nota ? `<div class="mut" style="font-size:12px">${esc(x.nota)}</div>` : ''}</td><td class="n">${money(x.total)}</td><td class="mut">${esc(x.hoja)} · ${x.fila}</td></tr>`).join('')}</tbody></table></div>` : '<p class="mut">No hay facturas nuevas en el archivo.</p>';
      if (im.vista === 'cambios') return im.cambios.length ? `<p class="mut" style="margin:0 0 8px">Facturas registradas con datos distintos en el archivo. Solo se aplican las seleccionadas; el valor anterior se conserva en la bitácora.</p><div class="tw"><table><thead><tr><th></th><th>Ingeniero</th><th class="n">Factura</th><th>Campo</th><th>En el sistema</th><th>En el archivo</th></tr></thead><tbody>
        ${im.cambios.map((x, i) => x.dif.map((d, j) => `<tr>${j === 0 ? `<td rowspan="${x.dif.length}"><input type="checkbox" data-c="${i}" ${x.incl ? 'checked' : ''} style="width:auto"></td><td rowspan="${x.dif.length}">${CARGOS[x.cargo_id]}</td><td rowspan="${x.dif.length}" class="n folio">${x.factura || 's/n'}</td>` : ''}<td>${d[0]}${d[3] ? `<div class="badge b-bad" style="white-space:normal">⚠ ${d[3]}</div>` : ''}</td><td class="wrap">${esc(d[1])}</td><td class="wrap"><b>${esc(d[2])}</b></td></tr>`).join('')).join('')}</tbody></table></div>` : '<p class="mut">Sin diferencias entre el sistema y el archivo.</p>';
      if (im.vista === 'iguales') return `<p class="mut">${im.iguales.length} facturas del archivo ya registradas sin diferencias.</p>`;
      if (im.vista === 'soloapp') return im.soloApp.length ? `<p class="mut" style="margin:0 0 8px">Facturas del sistema que <b>no aparecen en el archivo</b>. No se modifican.</p><div class="tw"><table><thead><tr><th>Ingeniero</th><th class="n">Factura</th><th>Fecha</th><th>Cliente</th><th class="n">Total</th></tr></thead><tbody>${im.soloApp.map(p => `<tr><td>${CARGOS[p.cargo_id]}</td><td class="n folio">${p.factura}</td><td>${fdm(p.fecha)}</td><td class="wrap">${esc(p.cliente)}</td><td class="n">${money(p.total)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="mut">Todas las facturas del sistema aparecen en el archivo.</p>';
      return `${im.errores.length ? `<div class="msg err"><b>Renglones con error (${im.errores.length}):</b><br>${im.errores.map(esc).join('<br>')}</div>` : '<div class="msg ok">Sin errores en el archivo.</div>'}
        ${im.avisos.length ? `<div class="msg info"><b>Avisos (${im.avisos.length}):</b><br>${im.avisos.map(esc).join('<br>')}</div>` : ''}
        ${im.ignorados.length ? `<div class="msg info"><b>Secciones omitidas:</b><br>${im.ignorados.map(esc).join('<br>')}</div>` : ''}`;
    };
    cuerpo = `<div class="card"><b>Subir archivo PAGOS de la oficina</b><p class="mut" style="margin:6px 0 12px">Archivo con una hoja por mes y un bloque por ingeniero (FECHA, FAC., CLIENTE, IMPORTE, I.V.A, TOTAL). Las facturas existentes no se duplican ni se eliminan.</p>
      <div class="drop"><input type="file" id="px" accept=".xls,.xlsx,.xlsm"></div><div id="pres"></div></div>
      ${im ? `<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><div><b>${esc(im.archivo)}</b> · <span class="mut">${im.filas.length} facturas leídas</span></div>
        <button class="btn gold" id="pgg" ${nN + nC ? '' : 'disabled'}>${nN + nC ? `Guardar ${nN ? nN + ' nueva' + (nN === 1 ? '' : 's') : ''}${nN && nC ? ' y ' : ''}${nC ? nC + ' cambio' + (nC === 1 ? '' : 's') : ''}` : 'Sin cambios por guardar'}</button></div>
        <div class="chips" style="margin-top:10px">${pest('nuevos', 'Nuevas', im.nuevos.length, 'pos')}${pest('cambios', 'Con diferencias', im.cambios.length, im.cambios.length ? 'neg' : '')}${pest('iguales', 'Sin cambios', im.iguales.length)}${pest('soloapp', 'Solo en el sistema', im.soloApp.length)}${pest('revision', 'Errores y avisos', im.errores.length + im.avisos.length, im.errores.length ? 'neg' : '')}</div></div>${tabla()}` : ''}`;
  }
  $('#m').innerHTML = `<div class="chips" style="margin-bottom:12px">${vistas.map(v => `<button class="chip ${P.vista === v[0] ? 'on' : ''}" data-pv="${v[0]}">${v[1]}</button>`).join('')}</div>
    <div class="msg info" style="margin-top:0">${P.pagos.length} facturas del archivo PAGOS · ${nPend} sin depósito${banco ? ` · ${P.dep.length} depósitos del banco` : ''}</div>${cuerpo}`;
  /* eventos */
  document.querySelectorAll('[data-pv]').forEach(b => b.onclick = () => { P.vista = b.dataset.pv; P.est = ''; P.q = ''; P.sel = null; P.prop = null; P.ok = ''; vConcil(); });
  document.querySelectorAll('[data-pc]').forEach(b => b.onclick = () => { P.cargo = +b.dataset.pc; P.sel = null; vConcil(); });
  if ($('#pm')) $('#pm').onchange = e => { P.mes = e.target.value; vConcil(); };
  if ($('#pe')) $('#pe').onchange = e => { P.est = e.target.value; vConcil(); };
  if ($('#pq')) $('#pq').oninput = e => { P.q = e.target.value; clearTimeout(vConcil.t); vConcil.t = setTimeout(() => { vConcil().then(() => { const n = $('#pq'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }); }, 250); };
  if ($('#pxl')) $('#pxl').onclick = () => {
    if (P.vista === 'facturas') bajarExcel('facturas_pagos.xlsx', P.pagos.filter(p => (!P.cargo || p.cargo_id === P.cargo) && (!P.mes || mesDe(p.fecha) === P.mes)).map(p => ({ FECHA: p.fecha, FACTURA: p.factura, INGENIERO: CARGOS[p.cargo_id], CLIENTE: p.cliente, TOTAL: p.total, ESTADO: p.deposito_id ? 'Conciliada' : 'Sin depósito' })));
    else bajarExcel('depositos_banco.xlsx', (P._rows || []).map(d => ({ FECHA: d.fecha, INGENIERO: CARGOS[d.cargo_id], PAGADOR: d.pagador, CONCEPTO: d.concepto, MONTO: d.monto, LIGADO: d.lig, DIFERENCIA: d.dif })));
  };
  if (P.vista === 'depositos') {
    document.querySelectorAll('[data-sel]').forEach(a => a.onclick = e => { e.preventDefault(); P.sel = a.dataset.sel; P.ok = ''; vConcil().then(() => { const c = document.querySelector('.card[style*="gold"]'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }); });
    if ($('#pcl')) $('#pcl').onclick = () => { P.sel = null; vConcil(); };
    const chk = [...document.querySelectorAll('[data-lig]')];
    chk.forEach(c => c.onchange = () => { const ids = chk.filter(x => x.checked), s = ids.reduce((a, x) => a + +x.dataset.m, 0); $('#psum').textContent = 'Seleccionado: ' + money(s / 100); $('#pgo').disabled = !ids.length; });
    if ($('#pgo')) $('#pgo').onclick = async () => {
      const ids = chk.filter(x => x.checked).map(x => +x.dataset.lig), s = chk.filter(x => x.checked).reduce((a, x) => a + +x.dataset.m, 0);
      const sel = P.dep.find(d => d.id === P.sel), rest = c100(sel.monto) - (lig[sel.id] || 0);
      if (s !== rest && !confirm(`La suma seleccionada (${money(s / 100)}) difiere del saldo del depósito (${money(rest / 100)}) por ${money((rest - s) / 100)}. ¿Ligar de todos modos?`)) return;
      $('#pgo').disabled = true;
      const { error } = await sb.rpc('pagos_vincular', { p_pago_ids: ids, p_deposito: sel.id, p_origen: 'manual' });
      if (error) { alert(error.message); return vConcil(); }
      await cargarPagos(); P.ok = `Se ligaron ${ids.length} factura(s).`; vConcil();
    };
    document.querySelectorAll('[data-des]').forEach(a => a.onclick = async e => {
      e.preventDefault(); if (!confirm('¿Desligar la factura del depósito? La factura se conserva y queda sin depósito.')) return;
      const { error } = await sb.rpc('pagos_desvincular', { p_pago_ids: [+a.dataset.des] }); if (error) return alert(error.message);
      await cargarPagos(); vConcil();
    });
    if ($('#pbus')) $('#pbus').onclick = () => { P.prop = proponer(); P.ok = ''; vConcil(); };
    document.querySelectorAll('[data-pp]').forEach(c => c.onchange = () => { P.prop[+c.dataset.pp].incl = c.checked; vConcil(); });
    if ($('#pap')) $('#pap').onclick = async () => {
      const sel = P.prop.filter(x => x.incl); if (!sel.length) return;
      const b = $('#pap'); b.disabled = true; let n = 0;
      try {
        for (const x of sel) { b.textContent = `Aplicando… ${n} de ${sel.length}`; const { error } = await sb.rpc('pagos_vincular', { p_pago_ids: x.ids, p_deposito: x.dep.id, p_origen: 'auto' }); if (error) throw error; n++; }
      } catch (er) { alert(`Se aplicaron ${n} de ${sel.length}. ${er.message || er}`); }
      await cargarPagos(); P.prop = null; P.ok = `Se aplicaron ${n} conciliaciones.`; vConcil();
    };
  }
  if (P.vista === 'subir') {
    const im = P.imp;
    $('#px').onchange = async e => {
      const f = e.target.files[0]; if (!f) return; e.target.value = '';
      $('#pres').innerHTML = '<div class="msg info">Procesando archivo…</div>';
      try {
        const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: false, cellNF: false, cellText: false });
        const r = leerPagos(wb);
        if (!r.filas.length && !r.errores.length) { P.imp = null; return $('#pres').innerHTML = `<div class="msg err">No se encontraron facturas. Encabezados requeridos: FECHA, FAC., CLIENTE y TOTAL, con el nombre del ingeniero sobre cada bloque. Si el archivo corresponde a folios de egresos, utilizar «Importar Excel».${r.ignorados.length ? '<br>' + r.ignorados.map(esc).join('<br>') : ''}</div>`; }
        P.imp = { ...compararPagos(r), archivo: f.name };
      } catch (er) { P.imp = null; return $('#pres').innerHTML = `<div class="msg err">Error al leer el archivo: ${esc(er.message)}</div>`; }
      vConcil();
    };
    if (!im) return;
    document.querySelectorAll('[data-v]').forEach(b => b.onclick = e => { e.preventDefault(); im.vista = b.dataset.v; vConcil(); });
    document.querySelectorAll('input[data-n]').forEach(c => c.onchange = () => { im.nuevos[+c.dataset.n].incl = c.checked; vConcil(); });
    document.querySelectorAll('input[data-c]').forEach(c => c.onchange = () => { im.cambios[+c.dataset.c].incl = c.checked; vConcil(); });
    if ($('#todosN')) $('#todosN').onchange = e => { im.nuevos.forEach(x => x.incl = e.target.checked); vConcil(); };
    $('#pgg').onclick = async () => {
      const nuevos = im.nuevos.filter(x => x.incl), cambios = im.cambios.filter(x => x.incl);
      if (cambios.length && !confirm(`Se actualizarán ${cambios.length} factura(s) existentes con los datos del archivo. El valor anterior se conservará en la bitácora. ¿Continuar?`)) return;
      const b = $('#pgg'); b.disabled = true; const lote = 'pagos-' + new Date().toISOString().replace(/\D/g, '').slice(0, 14), tot = { nuevos: 0, cambios: 0, omitidos: [] };
      const N = nuevos.map(x => ({ cargo_id: x.cargo_id, fecha: x.fecha, factura: x.factura, cliente: x.cliente, importe: x.importe, iva: x.iva, total: x.total, nota: x.nota, hoja: x.hoja }));
      const C = cambios.map(x => ({ id: x.id, cargo_id: x.cargo_id, fecha: x.fecha, cliente: x.cliente, importe: x.importe, iva: x.iva, total: x.total }));
      try {
        for (let i = 0; i < Math.max(N.length, C.length); i += 150) {
          b.textContent = `Guardando… ${Math.min(i + 150, Math.max(N.length, C.length))} de ${Math.max(N.length, C.length)}`;
          const { data, error } = await sb.rpc('pagos_sincronizar', { p_nuevos: N.slice(i, i + 150), p_cambios: C.slice(i, i + 150), p_lote: lote });
          if (error) throw error;
          tot.nuevos += data.nuevos; tot.cambios += data.cambios; tot.omitidos.push(...(data.omitidos || []));
        }
      } catch (er) {
        b.disabled = false; b.textContent = 'Reintentar';
        return $('#pres').innerHTML = `<div class="msg err">${esc(er.message || er)}<br>Guardadas antes del error: ${tot.nuevos} nuevas y ${tot.cambios} cambios. Al cargar de nuevo el mismo archivo, lo ya guardado aparecerá en «Sin cambios» sin duplicarse.</div>`;
      }
      P.imp = null; await cargarPagos(); await vConcil();
      $('#pres').innerHTML = `<div class="msg ok">Archivo procesado: ${tot.nuevos} factura(s) nueva(s) y ${tot.cambios} actualizada(s).${tot.omitidos.length ? `<br><b>No guardadas (${tot.omitidos.length}):</b><br>${tot.omitidos.map(esc).join('<br>')}` : ''}</div>`;
    };
  }
}

/* Actualización en vivo: revisa cada 45 s (y al volver a la pestaña) si hay folios nuevos */
let _ref = false;
async function refrescar() {
  if (_ref || document.hidden || !S.perfil || !['folios', 'ingresos', 'cancun', 'acumulado'].includes(S.tab)) return;
  const ae = document.activeElement; if (ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName)) return;
  if (document.getElementById('dlg')) return;
  _ref = true;
  try {
    const firma = () => S.rows.length + ':' + S.rows.reduce((m, r) => Math.max(m, r.id), 0);
    const antes = firma(); await cargar();
    if (firma() !== antes) { const y = window.scrollY; shell(); window.scrollTo(0, y); }
  } catch (e) { } finally { _ref = false; }
}
setInterval(refrescar, 45000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refrescar(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
boot();
</script>
</body>
